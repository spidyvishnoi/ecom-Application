# Write in this format if your running file is application.properties

spring.application.name=Monolithic-ecommerce-application

# Enable H2 Console
#spring.h2.console.enabled=true

#spring.datasource.url=jdbc:h2:mem:test
#spring.jpa.show-sql=true
#spring.jpa.hibernate.ddl-auto=create

#now we are using oracle database
# Oracle Database Connection Settings
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=ecommerce_user

#Environment Variable Set
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Expose all actuator endpoints using * but if want to see any one endpoint then just use names like beans,health 
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=false
management.info.env.enabled=true
management.server.shutdown=graceful

#under info
info.app.name=MyNewApp
info.app.description=App built by us
info.app.version=1.0.0


